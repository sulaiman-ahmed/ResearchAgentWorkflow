[project]
name = "minibench"
version = "0.1.0"
description = "Local lab-informatics demo: reviewed CSV imports, historical checks, and cited research via MCP"
readme = "README.md"
authors = [
    { name = "Sulaiman Ahmed", email = "sulaimanahmed08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.scripts]
minibench = "minibench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
